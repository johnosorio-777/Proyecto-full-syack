<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - TusPeriféricos</title>
<link rel="stylesheet" href="dashboard.css">
</head>

<body>

<aside class="sidebar" id="sidebar">
    <h2 class="logo">TusPeriféricos</h2>
    <nav>
        <a href="#" class="menu-item active" data-seccion="inicio">🏠 Inicio</a>
        <a href="#" class="menu-item" data-seccion="usuarios">📋 Usuarios</a>
        <a href="#" class="menu-item" data-seccion="perfil">👤 Perfil</a>
        <a href="#" class="menu-item" id="btnSalir">🚪 Cerrar sesión</a>
    </nav>
</aside>

<main class="contenido">
    <header class="topbar">
        <button id="btnMenu" class="btn-menu">☰</button>
        <span>Hola, <strong id="emailUsuario"></strong></span>
    </header>

    <section id="inicio" class="seccion activa">
        <h1>Bienvenido al dashboard</h1>
        <div class="tarjetas">
            <div class="tarjeta"><h3>Usuarios registrados</h3><p id="totalUsuarios">0</p></div>
            <div class="tarjeta"><h3>Productos</h3><p>24</p></div>
            <div class="tarjeta"><h3>Pedidos</h3><p>5</p></div>
        </div>
    </section>

    <section id="usuarios" class="seccion">
        <h1>Usuarios registrados</h1>
        <table>
            <thead>
                <tr><th>#</th><th>Correo</th></tr>
            </thead>
            <tbody id="tablaUsuarios"></tbody>
        </table>
    </section>

    <section id="perfil" class="seccion">
        <h1>Perfil</h1>
        <p><strong>Correo:</strong> <span id="perfilEmail"></span></p>
    </section>
</main>

<script src="js/dashboard.js"></script>
</body>
</html>
