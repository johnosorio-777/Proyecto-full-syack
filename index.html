<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>

    <nav class="navbar">

        <div class="tituloNav">
            Titulo web
        </div>

        <div class="menu">
            <a href="">
                Inicio
            </a>
            <a href=""> Formulario</a>
            <a href=""> Login</a>
            <a href="tabla.html"> Tabla</a>

        </div>

    </nav>

    <div class="formularioContenedor">

        <form class="formulariostyle" id="formulario">
            <h1>Registro de usuario</h1>
            <hr style="margin-bottom: 20px;">

            <!-- nombre y apellidp -->
            <div class="fila">
                <div class="campo">
                    <label>Nombre</label>
                    <input type="text" id="nombreInput" placeholder="Ingrese su nombre">

                </div>
                <div class="campo">
                    <label>Apellido</label>
                    <input type="text" id="apellidoInput" placeholder="Ingrese su apellido">

                </div>
            </div>

            <!-- datos de contacto -->


            <div class="fila">
                <div class="campo">
                    <label>Telefono</label>
                    <input type="text" id="telefonoInput" placeholder="+5695051525354">
                </div>
                <div class="campo">
                    <label>Comuna</label>
                    <select id="comunaSelect">
                        <option value=""> Seleccione su comúna</option>
                        <option value="San bernardo">San bernardo </option>
                        <option value="La florida">La florida</option>
                        <option value="Maipu">Maipu</option>
                        <option value="Estacion central">Estacion central</option>
                    </select>
                </div>
            </div>
            

            <div class="botones">
                <button class="botonGuardar" type="submit">Guardar</button>
            </div>
            <div class="boton2">
                <button type="button" id="botonJuego">Guardar Juego</button>
            </div>

        </form>
        <script src="validaciones.js"></script>
    </div>
</body>

</html>
